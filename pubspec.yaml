name: space_news_explorer
description: Space News Explorer - Responsi Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management, route & dependency management (Modul VIII)
  get: ^4.6.6
  # HTTP request ke API (Modul V)
  http: ^1.2.0
  # Shared Preferences untuk session, data user & data favorit (Modul VI)
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
