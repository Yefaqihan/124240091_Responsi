name: spacenews_explorer
description: SpaceNews Explorer - Responsi Praktikum Pemrograman Mobile SI-A
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management, route & dependency management (Modul VIII)
  get: ^4.6.6
  # HTTP request ke API (Modul V)
  http: ^1.2.0
  # Local database: session, data user & data bookmark (Modul VI)
  shared_preferences: ^2.2.2
  # Membuka artikel asli di browser (soal 3 - Read Full Article)
  url_launcher: ^6.2.5
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
